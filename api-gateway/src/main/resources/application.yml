# TODO: this is a placeholder config. Adjust as needed.
server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true    # auto-route to services by their Eureka app-id, e.g. /AUTH-SERVICE/**
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
        - id: profile-service
          uri: lb://PROFILE-SERVICE
          predicates:
            - Path=/api/v1/profiles/**
        - id: connection-service
          uri: lb://CONNECTION-SERVICE
          predicates:
            - Path=/api/v1/connections/**
        - id: feed-service
          uri: lb://FEED-SERVICE
          predicates:
            - Path=/api/v1/feed/**, /api/v1/posts/**
        - id: social-service
          uri: lb://SOCIAL-SERVICE
          predicates:
            - Path=/api/v1/social/**
        - id: messaging-service
          uri: lb://MESSAGING-SERVICE
          predicates:
            - Path=/api/v1/messages/**, /ws/**
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/**
        - id: search-service
          uri: lb://SEARCH-SERVICE
          predicates:
            - Path=/api/v1/search/**
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
