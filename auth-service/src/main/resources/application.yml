# TODO: this is a placeholder config - fill in real datasource / secrets before running.
server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: auth-service-group
      auto-offset-reset: earliest
jwt:
  secret: CHANGE_ME_TO_A_LONG_RANDOM_BASE64_SECRET
  access-token-expiry-ms: 900000        # 15 min
  refresh-token-expiry-ms: 604800000    # 7 days

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
